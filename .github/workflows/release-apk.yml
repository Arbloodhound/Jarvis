# Builds the signed release APK on GitHub's machines, so no local Android setup is needed.
# Run it: Actions tab -> "Release APK" -> Run workflow (after this file is on main), or push
# a tag like v2.5.0. The APK is attached to the run as "app-release" (kept 14 days).
#
# One-time setup (see ultra-native/ondevice-brain/RELEASE_SIGNING.md): repository secrets
#   KEYSTORE_BASE64   the .jks file, base64-encoded
#   KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
name: Release APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null
          # r27c for the llama/whisper static libs; 27.0 is what AGP 8.7 builds the JNI libs with.
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "ndk;27.0.12077973" > /dev/null

      - name: CMake 3.28.3 (app/build.gradle.kts pins it; not an SDK package)
        run: |
          python3 -m venv "$RUNNER_TEMP/cmake"
          "$RUNNER_TEMP/cmake/bin/pip" install -q cmake==3.28.3 ninja
          echo "$RUNNER_TEMP/cmake/bin" >> "$GITHUB_PATH"

      - name: Native libraries (llama.cpp, whisper.cpp)
        run: |
          cmake --version | head -1
          export ANDROID_NDK="$ANDROID_HOME/ndk/27.2.12479018"
          bash ultra-native/ondevice-brain/build-llama-android.sh
          bash ultra-native/ondevice-brain/build-whisper-android.sh

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is not set. See ultra-native/ondevice-brain/RELEASE_SIGNING.md"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" \
            > ultra-native/keystore.properties
          echo "sdk.dir=$ANDROID_HOME" > ultra-native/local.properties

      - name: Unit tests, then the release build
        working-directory: ultra-native
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - name: Check signature and 16 KB alignment
        run: |
          APK=ultra-native/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | grep -E "DN|SHA-256"
          READELF="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          unzip -oq "$APK" 'lib/arm64-v8a/*' -d "$RUNNER_TEMP/apk"
          bad=0
          for f in "$RUNNER_TEMP"/apk/lib/arm64-v8a/*.so; do
            al=$("$READELF" -lW "$f" | awk '/LOAD/ {print $NF}' | sort -u | tr '\n' ' ')
            echo "$(basename "$f"): $al"
            [ "$al" = "0x4000 " ] || bad=1
          done
          [ $bad -eq 0 ] || { echo "::error::a native lib is not 16 KB-aligned"; exit 1; }

      - name: Remove the key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" ultra-native/keystore.properties

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ultra-native/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

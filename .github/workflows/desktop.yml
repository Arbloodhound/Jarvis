name: desktop

on:
  push:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
    tags: ["desktop-v*"]
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Start the real app, exercise window, clipboard, screen capture, notification, tray and hotkey, then quit.
      - name: Native self-test (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q && sudo apt-get install -yq xvfb libnss3 libgbm1 libasound2t64 > /dev/null
          JARVIS_HOME="$RUNNER_TEMP/jarvis" xvfb-run -a -s "-screen 0 1280x800x24" npx electron . --self-test --no-sandbox
      - name: Native self-test (Windows)
        if: runner.os == 'Windows'
        run: JARVIS_HOME="$RUNNER_TEMP/jarvis" npx electron . --self-test
      - name: Native self-test (macOS)
        if: runner.os == 'macOS'
        # Hosted macOS runners cannot grant Screen Recording, so that one check is reported, not failed.
        run: JARVIS_HOME="$RUNNER_TEMP/jarvis" JARVIS_SELF_TEST_SKIP=screenshot npx electron . --self-test

      - name: Build installer
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-${{ runner.os }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/latest*.yml
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: app
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Jarvis Desktop ${{ github.ref_name }}
          files: dist/*

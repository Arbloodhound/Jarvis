name: Idea or design feedback
description: A feature, a use case, or a flaw in how the gate or the brain is designed
labels: [idea]
body:
  - type: textarea
    id: idea
    attributes:
      label: What you'd want, or what you think is wrong
      description: Several parts of 2.3 came from design pushback in Reddit threads. Specific beats polite.
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: The real task behind it
      description: What you were actually trying to get the phone to do.
